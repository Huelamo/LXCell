[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lxcell"
version = "0.1.0"
description = "Local, auditable personal finance application."
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1,<4.0",
    "pandas",
    "pdfplumber>=0.11,<1.0",
    "SQLAlchemy>=2.0,<3.0",
    "streamlit",
]

[tool.setuptools.packages.find]
where = ["src"]
