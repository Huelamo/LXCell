[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lxcell"
version = "0.1.0"
description = "Local, auditable personal finance application."
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "SQLAlchemy>=2.0,<3.0",
]

[tool.setuptools.packages.find]
where = ["src"]
